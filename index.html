/* Layout: one-column phone app, sticky week header, bottom tab bar. Week types wear Olympic plate colours. */

.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}.cgrid input,.cgrid select{width:100%;box-sizing:border-box}.cgrid .wide{grid-column:1/-1}

.wk{margin-top:6px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

</style>

<script>
(()=>{

['agach_highbar','Agachamento livre high bar','Quadríceps'],['agach_livre','Agachamento livre low bar','Quadríceps'],['agach_smith','Agachamento no smith','Quadríceps'],['agach_pausado','Agachamento pausado','Quadríceps'],['leg_press','Leg press 45','Quadríceps'],['hack','Hack squat','Quadríceps'],['extensora','Cadeira extensora unilateral','Quadríceps'],

const EXN={},EXG={};LIB.forEach(([i,n,g])=>{EXN[i]=n;EXG[i]=g});

const DEFAULT_PROGRAM={
 A:{name:'A · Superiores 1',dow:1,items:[P('barra_fixa',2,'6~10',1),P('pulldown_corda',3,'6~10',1),P('sup_incl_halt',3,'6~10'),P('elev_lat_cross',3,'6~10',1),P('crucifixo_inverso',2,'6~10',1),P('elev_pernas',3,'6~10'),P('rosca_martelo',2,'6~10')]},

function weekType(dateStr){
  const m=monday(dateStr);
  const ov=(S.cfg.weekOverrides||{})[m]; if(ov) return ov;
  const anchorMon=S.cfg.anchorMon||'2026-11-16', anchorPos=S.cfg.anchorPos??4;
  if(m<anchorMon && (S.cfg.weekTypesHist||{})[m]) return S.cfg.weekTypesHist[m];
  const w=Math.round((parseD(m)-parseD(anchorMon))/6048e5);
  return CYCLE[(((w+anchorPos)%5)+5)%5];
}
function cyclePos(dateStr){return CYCLE.indexOf(weekType(dateStr))}
function phaseOf(dateStr){let p=PHASES[0][1];for(const [d,n] of PHASES) if(dateStr>=d) p=n;return p}

/* ---------- sessions ---------- */
function allSessions(){
  const m={};
  Object.values(S.hist).forEach(doc=>Object.entries(doc.sessions||{}).forEach(([id,s])=>m[id]={...s,id,src:'hist'}));
  Object.entries(S.sess).forEach(([id,s])=>{ if(s.deleted){delete m[id];return} m[id]={...s,id,src:'sess'} });
  return Object.values(m).sort((a,b)=>(b.date+(b.startedAt||'')).localeCompare(a.date+(a.startedAt||'')));
}
let _cache=null,_cacheKey='';
function sessionsCached(){const k=String(S._rev);if(k!==_cacheKey){_cache=allSessions();_cacheKey=k}return _cache}
function entriesFor(exId,gym){ // finished entries, newest first
  const out=[];
  for(const s of sessionsCached()){ if(s.finished===false) continue;
    for(const e of s.exs||[]){ if(e.ex!==exId) continue; const g=e.gym||s.gym; if(gym&&g!==gym) continue;
      const sets=(e.sets||[]).filter(x=>x.kg!=null||x.r!=null); if(!sets.length) continue;
      out.push({date:s.date,wt:(S.cfg.weekOverrides||{})[monday(s.date)]||s.wt||weekType(s.date),gym:g,sets,mr:!!e.mr,note:e.note||'',sid:s.id}); } }
  return out;
}
function workSets(sets){ // the heaviest load's sets
  const loads=sets.filter(x=>x.kg!=null&&x.r!=null); if(!loads.length) return sets.filter(x=>x.r!=null);
  const top=Math.max(...loads.map(x=>x.kg)); return loads.filter(x=>x.kg===top);
}
function rangeOf(item){const m=String(item?.reps||'6~10').match(/(\d+)\D+(\d+)/);if(m)return[+m[1],+m[2]];const n=parseInt(item?.reps);return n?[n,n]:[6,10]}
function stepFor(ex){const g=exGroup(ex);return /Peito|Ombro|Bíceps|Tríceps/.test(g)&&/halt|martelo|lat_halt|concentrada|inclinada/.test(ex)?2:(/agach|terra|barra|smith/.test(ex)?2.5:5)}
function computeTarget(item,gym,date,wtOverride){
  const ex=item.ex, wt=wtOverride||weekType(date), thisMon=monday(date);
  const [lo,hi]=rangeOf(item);
  let hist=entriesFor(ex,gym).filter(e=>!e.mr&&monday(e.date)<thisMon), other=false;
  if(!hist.length){hist=entriesFor(ex,null).filter(e=>!e.mr&&monday(e.date)<thisMon);other=hist.length>0}
  const last=hist[0]||null;
  const ref=hist.find(e=>['ordinaria','ordinaria2','choque'].includes(e.wt))||last;
  let sets=item.sets||2;
  if(wt==='choque'&&item.pf) sets+=1;
  if(wt==='deload') sets=Math.max(1,sets-1);
  const t={wt,sets,lo,hi,ref,last,other,kg:null,reps:[],unit:'kg',msg:''};
  if(!ref){t.msg='Sem histórico: comece na faixa '+lo+'–'+hi+' reps com RIR 1.';t.reps=Array(sets).fill(null);return t}
  const ws=workSets(ref.sets); t.kg=ws[0]?.kg??null; t.unit=(ref.sets.find(x=>x.u)||{}).u||'kg';
  const rr=ws.map(x=>x.r);
  const at=i=>rr[Math.min(i,rr.length-1)]??lo;
  if(wt==='estabilizadora'||wt==='deload'){ t.reps=Array.from({length:sets},(_,i)=>Math.max(1,at(i)-2)); t.msg=wt==='deload'?'Mesmo peso, 2 reps a menos, 1 série a menos.':'Mesmo peso, 2 reps a menos.'; }
  else{
    if(Math.min(...rr.slice(0,sets))>=hi && t.kg!=null){ t.kg=+(t.kg+stepFor(ex)).toFixed(2); t.reps=Array(sets).fill(lo); t.msg='Bateu o topo da faixa ('+hi+'). Suba a carga e volte para '+lo+'.'; }
    else { t.reps=Array.from({length:sets},(_,i)=>Math.min(hi+1,at(i)+1)); t.msg='+1 rep por série sobre a última '+TYPES[ref.wt].toLowerCase()+'.'; }
  }
  return t;
}
const setsTxt=sets=>{const groups=[];sets.forEach(x=>{const k=x.kg==null?'PC':f1(x.kg);const g=groups[groups.length-1];if(g&&g.k===k)g.r.push(x.r);else groups.push({k,r:[x.r],u:x.u})});return groups.map(g=>g.k+(g.k==='PC'?'':(g.u==='lbs'?' lb':' kg'))+' × '+g.r.map(r=>r==null?'?':f1(r)).join(', ')).join(' · ')};
const lastNote=(ex)=>{for(const s of sessionsCached()){for(const e of s.exs||[]) if(e.ex===ex&&e.note&&s.finished!==false) return {note:e.note,date:s.date}} return null};

/* ---------- db ---------- */
/* ---------- local storage (IndexedDB) replacing the claude.ai db ---------- */
function LocalDB(){
  const mem={}; const subs=[]; let dbp=new Promise((res,rej)=>{const r=indexedDB.open('caderno-treino',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const ready=dbp.then(db=>new Promise(res=>{const tx=db.transaction('docs');const st=tx.objectStore('docs');const rq=st.openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){mem[c.key]=c.value;c.continue()}else res()}}));
  const persist=(k,v)=>dbp.then(db=>new Promise((res,rej)=>{const tx=db.transaction('docs','readwrite');v===undefined?tx.objectStore('docs').delete(k):tx.objectStore('docs').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}));
  const snapDoc=p=>({id:p.split('/')[1],exists:mem[p]!==undefined,data:()=>mem[p],metadata:{fromCache:false}});
  const qs=c=>{const docs=Object.keys(mem).filter(k=>k.startsWith(c+'/')).map(k=>({id:k.slice(c.length+1),exists:true,data:()=>mem[k]}));return {docs,size:docs.length,empty:!docs.length}};
  const fire=c=>subs.forEach(([cc,f,isDoc])=>{ if(isDoc){ if(cc.startsWith(c+'/')) f(snapDoc(cc)) } else if(cc===c) f(qs(c)) });
  const api={
    doc:p=>({get:async()=>{await ready;return snapDoc(p)},set:async d=>{mem[p]=JSON.parse(JSON.stringify(d));await persist(p,mem[p]);fire(p.split('/')[0])},delete:async()=>{delete mem[p];await persist(p,undefined);fire(p.split('/')[0])},onSnapshot:f=>{subs.push([p,f,true]);ready.then(()=>f(snapDoc(p)));return()=>{}}}),
    collection:c=>({onSnapshot:f=>{subs.push([c,f,false]);ready.then(()=>f(qs(c)));return()=>{}}}),
    _all:async()=>{await ready;return {...mem}},
    _putMany:async(obj)=>{await ready;for(const [k,v] of Object.entries(obj)){mem[k]=v;await persist(k,v)}['cfg','hist','sessions','weights','cardio'].forEach(fire)}
  };
  return api;
}

  let h2=false;db.collection('sessions').onSnapshot(q=>{S.sess={};q.docs.forEach(d=>S.sess[d.id]=d.data());S._rev++;if(!h2){h2=true;done()}else if(S.loaded&&!S.editing)route()},err);

}

function newExEntry(it,gym,date,wt){
  const tg=computeTarget(it,gym,date,wt);
  return {ex:it.ex,plan:{sets:tg.sets,reps:it.reps,pf:!!it.pf},unit:tg.unit,note:'',sets:Array.from({length:tg.sets},(_,i)=>({kg:tg.kg,r:null,t:tg.reps[i]??null,done:false}))};
}
function startSession(day,gym){

  S.draft={id:'s'+Date.now(),date:t,day,gym,wt,finished:false,startedAt:new Date().toTimeString().slice(0,5),exs:pr.items.map(it=>newExEntry(it,gym,t,wt))};
  saveDraftNow(); route();
}

async function finishSession(){

  const body={date:d.date,day:d.day||null,gym:d.gym,wt:d.wt,startedAt:d.startedAt||null,endedAt:new Date().toTimeString().slice(0,5),finished:true,exs};

}

function sessVol(s){let v=0;for(const e of s.exs||[]) for(const x of e.sets||[]) if(x.kg!=null&&x.r!=null) v+=toKg(x)*x.r;return v}

/* ---------- Progresso ---------- */
const METRICS={e1rm:'1RM estimado',top:'Carga máxima',vol:'Volume (kg × reps)',reps:'Reps totais',bestReps:'Reps na carga máx.'};
const GROUPS={session:'Sessão',week:'Microciclo',meso:'Mesociclo',macro:'Macrociclo'};
function exMetrics(e){const ok=e.sets.filter(x=>x.kg!=null&&x.r!=null);const top=ok.length?Math.max(...ok.map(x=>x.kg)):null;
  return {top,e1rm:ok.length?Math.max(...ok.map(x=>x.kg*(1+x.r/30))):null,vol:ok.reduce((a,x)=>a+x.kg*x.r,0),reps:e.sets.reduce((a,x)=>a+(x.r||0),0),bestReps:top==null?Math.max(0,...e.sets.map(x=>x.r||0)):Math.max(...ok.filter(x=>x.kg===top).map(x=>x.r))}}
function mesoKey(date){const m=monday(date);const anchorMon=S.cfg.anchorMon||'2026-11-16';const anchorPos=S.cfg.anchorPos??4;const w=Math.round((parseD(m)-parseD(anchorMon))/6048e5)+anchorPos;const blk=Math.floor(w/5);return addDays(anchorMon,(blk*5-anchorPos)*7)}
function groupKey(date,g){return g==='session'?date:g==='week'?monday(date):g==='meso'?mesoKey(date):phaseOf(date)}
function series(exId,gym,metric,g){
  const es=entriesFor(exId,gym||null).filter(e=>!e.mr).reverse(); const buckets=new Map();
  for(const e of es){const k=groupKey(e.date,g);const m=exMetrics(e)[metric];if(m==null)continue;const b=buckets.get(k)||{k,date:e.date,vals:[],wt:e.wt};b.vals.push(m);buckets.set(k,b)}
  return [...buckets.values()].map(b=>({k:b.k,date:b.date,wt:b.wt,v:(metric==='vol'||metric==='reps')&&g!=='session'?b.vals.reduce((a,c)=>a+c,0):Math.max(...b.vals)}));
}
function lineChart(pts,opts={}){
  if(pts.length<1) return '<div class="empty">Sem dados para este filtro.</div>';
  const W=360,H=210,pl=36,pr=8,pt=10,pb=24; const vs=pts.map(p=>p.v); let lo=Math.min(...vs),hi=Math.max(...vs); if(lo===hi){lo-=1;hi+=1} const pad=(hi-lo)*.1;lo-=pad;hi+=pad;
  const x=i=>pl+(pts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(pts.length-1)); const y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  let g=''; for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${f1(Math.round(v*10)/10)}</text>`}
  const step=Math.max(1,Math.ceil(pts.length/4)); pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1) g+=`<text x="${x(i)}" y="${H-8}" text-anchor="${i===pts.length-1&&pts.length>1?'end':i===0&&pts.length>1?'start':'middle'}">${esc(opts.label?opts.label(p):fmtD(p.date))}</text>`});
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p.v).toFixed(1)).join('');
  const area=path+`L${x(pts.length-1).toFixed(1)},${H-pb}L${x(0).toFixed(1)},${H-pb}Z`;
  let ln2=''; if(opts.avg){ln2=`<path class="ln2" d="${opts.avg.map((v,i)=>v==null?'':((i&&opts.avg[i-1]!=null?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1))).join('')}"/>`}
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?4:2.6}" fill="${p.wt?`var(--p-${p.wt==='ordinaria2'?'ord':p.wt==='estabilizadora'?'estab':p.wt==='ordinaria'?'ord':p.wt})`:'var(--accent)'}" stroke="var(--surface)" stroke-width="1.5"><title>${fmtD(p.date)}: ${f1(p.v)}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'gráfico')}">${g}<path class="area" d="${area}"/><path class="ln" d="${path}"/>${ln2}${dots}</svg>`;
}
function exStatus(exId){ // compare best e1RM last 5 weeks vs previous 5 at main gym
  const all=entriesFor(exId,null).filter(e=>!e.mr); if(all.length<3) return null;
  const gc={};all.slice(0,12).forEach(e=>gc[e.gym]=(gc[e.gym]||0)+1); const gym=Object.entries(gc).sort((a,b)=>b[1]-a[1])[0][0];
  const es=all.filter(e=>e.gym===gym); const t=todayISO(); const c1=addDays(t,-35),c2=addDays(t,-70);
  const best=a=>a.length?Math.max(...a.map(e=>exMetrics(e).e1rm||0)):null;
  const a=best(es.filter(e=>e.date>=c1)), b=best(es.filter(e=>e.date<c1&&e.date>=c2)); if(a==null||b==null||!b) return {gym,last:es[0],delta:null};
  return {gym,last:es[0],delta:(a-b)/b*100,a,b};
}

  <details><summary class="small" style="padding:4px 0"><b>Ver tabela</b></summary><div class="scroll"><table class="tbl"><tr><th>${GROUPS[st.group]}</th><th>${METRICS[st.metric]}</th></tr>${pts.slice().reverse().map(p=>`<tr><td>${st.group==='macro'?esc(p.k):fmtD(p.date)}</td><td>${f1(Math.round(p.v*10)/10)}</td></tr>`).join('')}</table></div></details></div>

  <div class="list">${statuses.length?statuses.map(x=>{const d=x.s.delta;const cls=d>1.5?'st-up':d<-1.5?'st-down':'st-flat';const lab=d>1.5?'Evoluindo':d<-1.5?'Caindo':'Estagnado';return `<div class="li"><div style="min-width:0"><b>${esc(exName(x.id))}</b><div class="tiny muted">${esc(gymName(x.s.gym))} · ${f1(Math.round(x.s.b))} → ${f1(Math.round(x.s.a))}</div></div><span class="status ${cls}">${lab} ${d>0?'+':''}${f1(Math.round(d*10)/10)}%</span></div>`}).join(''):'<div class="empty">Ainda não há 10 semanas de dados recentes para comparar.</div>'}</div></div>
  <div class="card"><h3>Volume total por semana</h3><div class="small muted">Soma de carga × reps de todos os exercícios (lbs convertidas para kg).</div>${lineChart(wpts,{aria:'Volume semanal'})}</div></div>`;
  v.innerHTML=h;
  $('#pex').onchange=e=>{st.ex=e.target.value;st.gym='';route()};

  v.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{st.metric=b.dataset.pm;route()});
  v.querySelectorAll('[data-pgr]').forEach(b=>b.onclick=()=>{st.group=b.dataset.pgr;route()});
}

/* ---------- Peso ---------- */
function viewPeso(v){
  S.editing=false; const wd=weightDays(); const days=Object.keys(wd).sort(); const t=todayISO();
  const lastV=days.length?dayVal(wd[days[days.length-1]]):'';
  const cut=S.wRange?addDays(t,-S.wRange):'0000'; const sel=days.filter(d=>d>=cut);
  const pts=sel.map(d=>({date:d,v:dayVal(wd[d])}));
  const avg=pts.map((p,i)=>{const from=addDays(p.date,-6);const w=pts.filter(q=>q.date>=from&&q.date<=p.date);return w.reduce((a,q)=>a+q.v,0)/w.length});
  const wk=d=>{const from=addDays(t,-d);const a=days.filter(x=>x>from).map(x=>dayVal(wd[x]));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
  const a7=wk(7),a14=wk(14)!=null&&wk(7)!=null?(()=>{const from=addDays(t,-14),to=addDays(t,-7);const a=days.filter(x=>x>from&&x<=to).map(x=>dayVal(wd[x]));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null})():null;
  let h=`<div class="stack"><h2>Peso em jejum</h2>
  <div class="card stack"><div class="label">Hoje, depois do banheiro</div><div class="weighin"><input id="wkg" inputmode="decimal" placeholder="${lastV?f1(lastV):'74,5'}" aria-label="Peso em kg"><span class="muted">kg</span><button class="btn primary" id="wsave">Salvar</button></div>
  ${wd[t]?`<div class="small">Hoje: ${wd[t].map((x,i)=>`${esc(x.t||'')} <b>${f1(x.kg)}</b> <button class="btn sm ghost" data-wdel="${i}">apagar</button>`).join(' · ')}<div class="tiny muted">Vale o menor valor do dia.</div></div>`:''}</div>
  <div class="kpis"><div class="kpi"><div class="label">Média 7 dias</div><div class="v">${a7?f1(Math.round(a7*10)/10):'–'}</div></div><div class="kpi"><div class="label">Semana anterior</div><div class="v">${a14?f1(Math.round(a14*10)/10):'–'}</div></div><div class="kpi"><div class="label">Variação</div><div class="v">${a7&&a14?((a7-a14>=0?'+':'')+f1(Math.round((a7-a14)*100)/100)):'–'}</div></div></div>
  <div class="card"><div class="seg" style="margin-bottom:8px">${[[30,'30 dias'],[90,'90 dias'],[365,'1 ano'],[0,'Tudo']].map(([k,n])=>`<button data-wr="${k}" class="${S.wRange===k?'on':''}">${n}</button>`).join('')}</div>
  ${lineChart(pts,{avg,aria:'Peso diário'})}<div class="tiny muted">Linha cheia: menor peso de cada dia. Tracejada: média móvel de 7 dias.</div></div>
  <div class="card"><h3>Registros</h3><div class="list">${days.slice().reverse().slice(0,40).map(d=>`<div class="li"><span>${fmtDL(d)}</span><span><b>${f1(dayVal(wd[d]))}</b>${wd[d].length>1?' <span class="tiny muted">('+wd[d].map(x=>f1(x.kg)).join(' / ')+')</span>':''}</span></div>`).join('')||'<div class="empty">Nenhum registro.</div>'}</div></div></div>`;
  v.innerHTML=h;
  $('#wsave').onclick=()=>{const n=num($('#wkg').value);if(!n||n<30||n>200){toast('Digite um peso válido, ex.: 74,5');return}addWeight(n)};
  v.querySelectorAll('[data-wr]').forEach(b=>b.onclick=()=>{S.wRange=+b.dataset.wr;route()});
  v.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>delWeight(t,+b.dataset.wdel));
}


async function importBackup(j){
  if(!j||(!j.sessions&&!j.hist)) throw new Error('não parece um backup do Caderno de Treino');
  const put={};
  if(j.cfg&&Object.keys(j.cfg).length) put['cfg/main']={...S.cfg,...j.cfg};
  const sess=Array.isArray(j.sessions)?j.sessions:Object.entries(j.sessions||{}).map(([id,s])=>({...s,id}));
  // imported history goes into month docs (same shape as the original import), app sessions stay sessions
  const months={};
  for(const s of sess){ if(!s||!s.date||s.finished===false) continue; const {id,src,...body}=s;
    if(String(id).startsWith('h')){ const m='hist-'+s.date.slice(0,7); (months[m]=months[m]||{month:s.date.slice(0,7),sessions:{...((S.hist[m]||{}).sessions||{})}}).sessions[id]=body }
    else put['sessions/'+id]={...body,finished:true}; }
  Object.entries(months).forEach(([k,v])=>put['hist/'+k]=v);
  const w=j.weights||{}; const wm={};
  for(const [day,arr] of Object.entries(w)){ const k='w-'+day.slice(0,7); const doc=wm[k]=wm[k]||JSON.parse(JSON.stringify(S.wdocs[k]||{month:day.slice(0,7),days:{}})); const have=new Set((doc.days[day]||[]).map(x=>x.t+'|'+x.kg)); doc.days[day]=(doc.days[day]||[]).concat(arr.filter(x=>!have.has(x.t+'|'+x.kg))) }
  Object.entries(wm).forEach(([k,v])=>put['weights/'+k]=v);
  (Array.isArray(j.cardio)?j.cardio:[]).forEach(c=>{if(c&&c.id&&c.date){const {id,...b}=c;put['cardio/'+id]=b}});
  await S.db._putMany(put); S._rev++; route();
  return sess.length;
}

  <div class="row"><label class="small" for="curwt">Esta semana é</label><select id="curwt">${CYCLE.map(k=>`<option value="${k}" ${k===weekType(t)?'selected':''}>${TYPES[k]}${k==='ordinaria2'?' (2ª)':''}</option>`).join('')}</select></div>

  <div class="card stack"><h3>Lembrete do peso</h3><div class="small">Para receber o lembrete toda manhã no iPhone:</div>
  <ol class="small" style="margin:0;padding-left:18px"><li>Abra o app <b>Atalhos</b> › <b>Automação</b> › <b>+</b> › <b>Horário do dia</b>.</li><li>Escolha o horário (ex.: 7:00), <b>Diariamente</b>, e marque <b>Executar imediatamente</b>.</li><li>Adicione a ação <b>Mostrar notificação</b> com o texto "Registrar peso em jejum" e depois <b>Abrir URLs</b> com o link deste app terminando em <code>#peso</code>.</li></ol>
  <div class="tiny muted">Para abrir como app: no Safari, toque em Compartilhar › Adicionar à Tela de Início.</div></div>
  <div class="card stack"><h3>Academias</h3><div class="small muted">Anote barras e anilhas de cada uma. As metas de carga são sempre calculadas pela academia escolhida.</div>
  ${gyms().map((g,i)=>`<div class="stack" style="gap:6px"><div class="row"><input data-gname="${i}" value="${esc(g.name)}" style="flex:1"><button class="btn sm ghost" data-grm="${i}">Remover</button></div><textarea data-gnote="${i}" placeholder="Ex.: barra olímpica 20 kg, barra média 15 kg, anilhas em kg; halteres sobem de 2 em 2">${esc(g.notes||'')}</textarea></div>`).join('')}
  <div class="row"><input id="newgym" placeholder="Nova academia" style="flex:1"><button class="btn sm" id="addgym">Adicionar</button></div><button class="btn primary" id="savegyms">Salvar academias</button></div>
  <div class="card stack"><h3>Programa</h3><div class="seg">${Object.entries(pr).map(([k,p])=>`<button data-sd="${k}" class="${k===sd?'on':''}">${esc(p.name.split('·')[0].trim())}</button>`).join('')}</div>
  <div class="list">${pr[sd].items.map((it,i)=>`<div class="li" style="flex-wrap:wrap"><div style="flex:1 1 200px;min-width:0"><b>${esc(exName(it.ex))}</b></div><div class="row"><input data-ps="${i}" value="${it.sets}" inputmode="numeric" style="width:48px" aria-label="Séries"><input data-pr="${i}" value="${esc(it.reps)}" style="width:70px" aria-label="Reps"><label class="tiny"><input type="checkbox" data-ppf="${i}" ${it.pf?'checked':''}> PF</label><button class="btn sm ghost" data-pup="${i}" aria-label="Subir">↑</button><button class="btn sm ghost" data-prm="${i}" aria-label="Remover">✕</button></div></div>`).join('')}</div>
  <button class="btn" id="paddbtn">+ Exercício no ${esc(sd)}</button>${S.paddOpen?exPicker('prog'):''}
  <button class="btn primary" id="saveprog">Salvar programa</button></div>
  <div class="card stack"><h3>Backup</h3><div class="small muted">Versão ${APP_VERSION}. Seus dados ficam guardados neste iPhone. Exporte um backup de vez em quando (Arquivos, iCloud Drive ou WhatsApp) para não perder nada se trocar de aparelho.</div><button class="btn" id="export">Exportar backup (.json)</button><label class="btn" for="import" style="text-align:center">Importar backup (.json)</label><input type="file" id="import" accept=".json,application/json" hidden><div class="tiny muted">Importar junta o arquivo com o que já está aqui; treinos com o mesmo identificador são substituídos pelos do arquivo.</div></div></div>`;
  v.innerHTML=h;
  $('#curwt').onchange=e=>saveCfg({anchorMon:monday(t),anchorPos:CYCLE.indexOf(e.target.value),weekTypesHist:{...(S.cfg.weekTypesHist||{}),...histUntil(monday(t))}});
  const G=JSON.parse(JSON.stringify(gyms()));
  v.querySelectorAll('[data-gname]').forEach(i=>i.oninput=()=>G[+i.dataset.gname].name=i.value);
  v.querySelectorAll('[data-gnote]').forEach(i=>i.oninput=()=>G[+i.dataset.gnote].notes=i.value);
  v.querySelectorAll('[data-grm]').forEach(b=>b.onclick=()=>{G.splice(+b.dataset.grm,1);saveCfg({gyms:G})});
  $('#addgym').onclick=()=>{const n=$('#newgym').value.trim();if(!n)return;G.push({id:n.toLowerCase().replace(/[^a-z0-9]+/g,'-'),name:n});saveCfg({gyms:G})};
  $('#savegyms').onclick=()=>saveCfg({gyms:G});
  const PR=JSON.parse(JSON.stringify(pr));
  v.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{S.setDay=b.dataset.sd;route()});
  v.querySelectorAll('[data-ps]').forEach(i=>i.oninput=()=>PR[sd].items[+i.dataset.ps].sets=parseInt(i.value)||1);
  v.querySelectorAll('[data-pr]').forEach(i=>i.oninput=()=>PR[sd].items[+i.dataset.pr].reps=i.value);
  v.querySelectorAll('[data-ppf]').forEach(i=>i.onchange=()=>PR[sd].items[+i.dataset.ppf].pf=i.checked);
  v.querySelectorAll('[data-pup]').forEach(b=>b.onclick=()=>{const i=+b.dataset.pup;if(i>0){const a=PR[sd].items;[a[i-1],a[i]]=[a[i],a[i-1]];saveCfg({program:PR})}});
  v.querySelectorAll('[data-prm]').forEach(b=>b.onclick=()=>{PR[sd].items.splice(+b.dataset.prm,1);saveCfg({program:PR})});
  $('#paddbtn').onclick=()=>{S.paddOpen=!S.paddOpen;route()};

  v.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{PR[sd].items.push({ex:b.dataset.pick,sets:2,reps:'6~10',pf:false});S.paddOpen=false;S.pickQ='';saveCfg({program:PR})});
  $('#saveprog').onclick=()=>saveCfg({program:PR});
  $('#export').onclick=async()=>{ const data=JSON.stringify({app:'caderno-treino',v:1,exportedAt:new Date().toISOString(),cfg:S.cfg,sessions:allSessions(),weights:weightDays(),cardio:cardioList()});
    const file=new File([data],'treino-backup-'+t+'.json',{type:'application/json'});
    try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup do treino'});return} }catch(e){if(e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000) };
  $('#import').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); const n=await importBackup(j); toast(n+' treinos importados'); }catch(err){ toast('Arquivo inválido: '+err.message) } e.target.value=''; };
}
function histUntil(mon){ // freeze computed week types for past weeks before re-anchoring
  const o={}; const first=sessionsCached().length?monday(sessionsCached()[sessionsCached().length-1].date):mon; let m=first;
  while(m<mon){o[m]=weekType(m);m=addDays(m,7)} return o;
}

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}))}

  if(j.v&&j.v!==APP_VERSION){ const reg=await navigator.serviceWorker?.getRegistration(); if(reg) await reg.update().catch(()=>{});
    let k='reloadedFor';try{if(sessionStorage.getItem(k)===j.v)return;sessionStorage.setItem(k,j.v)}catch(e){} if(S.editing&&S.draft){ await saveDraftNow() } location.reload() } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate() });
